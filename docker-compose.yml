name: momo-store

networks:
  momo-net:
    internal: true
    driver: bridge

volumes:
  frontend-html:
  nginx-logs:
  data:

services:
  frontend:
    container_name: frontend
    image: ${DOCKER_USER}/docker-project-frontend:${APP_VERSION:-1.0.0}
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: ${VUE_APP_API_URL:-/api}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - frontend-html:/mnt
    ports:
      - "8080:8080"
    networks:
      - momo-net
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    container_name: backend
    image: ${DOCKER_USER}/docker-project-backend:${APP_VERSION:-1.0.0}
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "8081:8081"
    volumes:
      - data:/app/data:rw
    networks:
      - momo-net
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
        reservations:
          cpus: "0.04"
          memory: 64M
    healthcheck:
      test:
        [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
