name: momo-store

networks:
  momo-net:
    internal: true
    driver: bridge

volumes:
  frontend-html:
  nginx-logs:
  data:

secrets:
  backend_api_token:
    file: ${BACKEND_SECRET_FILE:-./secrets/backend_api_token.example}

services:
  frontend:
    container_name: frontend
    image: momo-store-frontend:${APP_VERSION:-1.0.0}
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: ${VUE_APP_API_URL:-/api}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - frontend-html:/mnt
    ports:
      - "80:8080"
    networks:
      - momo-net
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    container_name: backend
    image: momo-store-backend:${APP_VERSION:-1.0.0}
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      APP_ENV: ${APP_ENV:-production}
      APP_SECRET_FILE: /run/secrets/backend_api_token
    ports:
      - "8081:8081"
    volumes:
      - data:/app/data:rw
    secrets:
      - source: backend_api_token
        target: backend_api_token
    networks:
      - momo-net
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
        reservations:
          cpus: "0.04"
          memory: 64M
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
